  - [dm-prob-axioms, dm-conditional-bayes]
  - [dm-random-variables, st-distributions]
  - [la-inverse-det, la-independence]
  - [la-projections, la-least-squares]
  - [la-eigen, la-svd]
  - [mv-partials, mv-chain]
  - [mv-gradient, mv-extrema]
  - [st-confidence, st-hypothesis]
  - [st-bootstrap, st-hypothesis]
