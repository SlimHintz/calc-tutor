unit:
  id: U02
  ord: 40
  course: core
  title: "Derivatives"
  constellation: "The Tangent"
  color: "#ff8a5c"
  blurb: |
    The derivative measures instantaneous rate of change -- the slope of the tangent line.
    You'll rebuild every rule from scratch and see why the chain rule is the beating heart
    of machine learning.
  ds_why: |
    Gradients drive all of model training. Backpropagation is the chain rule applied
    systematically. Sensitivities, marginal effects and elasticities are derivatives.

topics:
  - id: d-definition
    title: "The Derivative as a Limit"
    xp: 70
    prereqs: [lim-laws]
    readings:
      - {book: STW, sec: "2.1", title: "Derivatives and Rates of Change"}
      - {book: OS1, sec: "3.1", title: "Defining the Derivative"}
    videos:
      - {book: 3B1B, n: 2, title: "The paradox of the derivative"}
    summary: |
      $f'(a)=\lim_{h\to0}\frac{f(a+h)-f(a)}{h}$: the slope of secant lines converging to the
      tangent. Average rate of change becomes instantaneous.
    key_ideas:
      - 'Difference quotient $\frac{f(a+h)-f(a)}{h}$ = slope of a secant line.'
      - 'The tangent line at $a$: $y=f(a)+f''(a)(x-a)$.'
      - 'Notation: $f''(x)$, $\frac{dy}{dx}$, $\frac{d}{dx}f$, $Df$.'
    ds: |
      Finite differences $\frac{f(x+h)-f(x)}{h}$ are how you *check* a gradient
      implementation ("gradient checking"). Central differences $\frac{f(x+h)-f(x-h)}{2h}$
      are far more accurate.
    lab: |
      Running lab: from a run's distance-vs-time stream, compute average pace between
      successive GPS samples. That's a secant slope. Smaller windows -> closer to
      instantaneous speed (but noisier!).
    questions:
      - {type: expr, d: 2, var: x, q: 'Using the limit definition, $f(x)=x^2$ gives $f''(x)=?$', a: '2x', exp: '$\frac{(x+h)^2-x^2}{h}=2x+h\to 2x$.'}
      - {type: num, d: 1, q: 'Slope of the secant of $f(x)=x^2$ from $x=1$ to $x=3$?', a: '4', exp: '$(9-1)/(3-1)=4$.'}
      - {type: expr, d: 2, var: x, q: 'Equation of the tangent line to $y=x^2$ at $x=3$ (as $y=\dots$).', a: '6x-9', exp: '$y=9+6(x-3)=6x-9$.'}
    cards:
      - {f: 'Limit definition of $f''(a)$', b: '$\lim_{h\to0}\frac{f(a+h)-f(a)}{h}$'}
      - {f: 'Tangent line at $x=a$', b: '$y=f(a)+f''(a)(x-a)$'}
    fun:
      - kind: fact
        title: "Your watch computes derivatives"
        body: |
          Your Garmin's "current pace" is a numerical derivative of distance with respect to
          time, smoothed over a few seconds. GPS noise makes raw derivatives jittery -- which is
          why instant pace jumps around and lap pace (a secant slope!) is steady.

  - id: d-function
    title: "The Derivative as a Function"
    xp: 60
    prereqs: [d-definition, lim-continuity]
    readings:
      - {book: STW, sec: "2.2", title: "The Derivative as a Function"}
      - {book: OS1, sec: "3.2", title: "The Derivative as a Function"}
    videos:
      - {book: 3B1B, n: 10, title: "Higher order derivatives"}
    summary: |
      $f'$ is itself a function; graph it from $f$'s slopes. Differentiable implies
      continuous (not the converse). Second derivatives measure how slopes change.
    key_ideas:
      - 'Where $f$ increases, $f''>0$; at a smooth peak/valley, $f''=0$.'
      - 'Not differentiable at corners ($|x|$), cusps, vertical tangents, discontinuities.'
      - '$f''''$ = rate of change of the rate of change (acceleration, curvature).'
    ds: |
      ReLU has a corner at 0 -- not differentiable there -- yet deep learning works fine by
      choosing a subgradient. Second derivatives (curvature) set the ideal learning rate.
    lab: |
      Take the speed stream of a run (`velocity_smooth`) and numerically differentiate it
      (`np.gradient`) to get acceleration. Where are your biggest surges?
    questions:
      - {type: mc, d: 1, q: 'Where is $f(x)=|x|$ not differentiable?', choices: ['nowhere', '$x=0$', 'everywhere', '$x=\pm1$'], a: 1, exp: 'Corner at 0: left slope $-1$, right slope $+1$.'}
      - {type: expr, d: 1, var: x, q: 'If $f(x)=x^3$, find $f''''(x)$.', a: '6x', exp: '$f''=3x^2$, $f''''=6x$.'}
      - {type: mc, d: 2, q: 'True or false: every continuous function is differentiable.', choices: ['True', 'False'], a: 1, exp: 'False: $|x|$ is continuous but not differentiable at 0. (Differentiable => continuous is the true direction.)'}
    cards:
      - {f: 'Differentiable => continuous. Does continuous => differentiable?', b: 'No. Counterexample: $|x|$ at 0.'}
      - {f: 'Meaning of $f''''$', b: 'Rate of change of the slope: acceleration / curvature.'}
    fun:
      - kind: fact
        title: "The monster function"
        body: |
          In 1872 Weierstrass shocked mathematicians with a function that is continuous
          everywhere but differentiable *nowhere* -- a curve made entirely of corners.
          Stock prices and Brownian motion behave like this, which is why finance needed a
          whole new calculus (Ito's).

  - id: d-rules
    title: "Power, Product & Quotient Rules"
    xp: 70
    prereqs: [d-function]
    readings:
      - {book: STW, sec: "2.3", title: "Differentiation Formulas"}
      - {book: OS1, sec: "3.3", title: "Differentiation Rules"}
    videos:
      - {book: 3B1B, n: 3, title: "Derivative formulas through geometry"}
      - {book: 3B1B, n: 4, title: "Visualizing the chain rule and product rule"}
    summary: |
      $\frac{d}{dx}x^n=nx^{n-1}$, linearity, $(fg)'=f'g+fg'$, $\left(\frac{f}{g}\right)'=\frac{f'g-fg'}{g^2}$.
    key_ideas:
      - 'Power rule works for any real exponent: $\frac{d}{dx}\sqrt x=\frac{1}{2\sqrt x}$.'
      - 'Derivative is linear: $(af+bg)''=af''+bg''$.'
      - 'Product rule geometry: a rectangle with growing sides gains two thin strips.'
    ds: |
      Linearity of differentiation is why the gradient of a sum of per-example losses is the
      sum of per-example gradients -- the reason minibatch SGD works.
    lab: |
      Use `sympy.diff` to check your hand-derived derivatives for 5 functions. Then write a
      tiny finite-difference checker and confirm both agree.
    questions:
      - {type: expr, d: 1, var: x, q: 'Differentiate $4x^5-3x^2+7$.', a: '20x^4-6x', exp: 'Power rule term by term.'}
      - {type: expr, d: 2, var: x, q: 'Differentiate $x^2\sqrt{x}$ (hint: one exponent).', a: '(5/2)x^(3/2)', exp: '$x^{5/2}$, so $\frac52x^{3/2}$.'}
      - {type: expr, d: 2, var: x, q: 'Differentiate $\frac{x}{x+1}$.', a: '1/(x+1)^2', exp: 'Quotient: $\frac{(x+1)-x}{(x+1)^2}$.'}
      - {type: expr, d: 2, var: x, q: 'Differentiate $(x^2+1)(x^3-x)$ using the product rule.', a: '2x(x^3-x)+(x^2+1)(3x^2-1)', exp: '$f''g+fg''=2x(x^3-x)+(x^2+1)(3x^2-1)$, which simplifies to $5x^4-1$. Check: the product itself is $x^5-x$.'}
    cards:
      - {f: 'Product rule', b: '$(fg)''=f''g+fg''$'}
      - {f: 'Quotient rule', b: '$\left(\frac fg\right)''=\frac{f''g-fg''}{g^2}$ ("low d-high minus high d-low, over low squared")'}
    fun:
      - kind: puzzle
        title: "The 3-second product rule proof"
        body: |
          A square of side $x$ has area $x^2$. Grow the side by $dx$: the area gains two
          strips of $x\,dx$ plus a tiny $dx^2$ corner. So $d(x^2)\approx 2x\,dx$. Puzzle: use
          a cube to explain why $\frac{d}{dx}x^3=3x^2$.
        answer: "Growing a cube adds three thin slabs of area $x^2$ and thickness $dx$ (plus negligible edges/corner): $3x^2\\,dx$."

  - id: d-rates
    title: "Derivatives as Rates of Change"
    xp: 50
    prereqs: [d-rules]
    readings:
      - {book: STW, sec: "2.7", title: "Rates of Change in the Natural and Social Sciences"}
      - {book: OS1, sec: "3.4", title: "Derivatives as Rates of Change"}
    summary: |
      Velocity, acceleration, marginal cost, growth rates: derivatives as "how fast is this
      changing per unit of that."
    key_ideas:
      - 'Position $s(t)$ -> velocity $s''(t)$ -> acceleration $s''''(t)$.'
      - 'Units of $\frac{dy}{dx}$ = units of $y$ per unit of $x$.'
      - 'Marginal = derivative (marginal cost, marginal revenue, marginal effect).'
    ds: |
      "Marginal effects" in regression and "elasticities" in pricing models are derivatives.
      Interpreting a coefficient as "change in $y$ per unit $x$" is reading a derivative.
    lab: |
      Running lab: if your marathon split model is $t(d)$ (minutes vs. miles), $t'(d)$ is
      pace in min/mile. Fit a quadratic to your last long run's cumulative time vs distance;
      what does a positive $t''$ say about your fade?
    questions:
      - {type: num, d: 1, q: 'A runner''s position is $s(t)=0.2t^2+3t$ (meters, seconds). Velocity at $t=10$?', a: '7', exp: '$s''(t)=0.4t+3$, at 10: 7 m/s.'}
      - {type: mc, d: 1, q: 'If $C(q)$ is cost in dollars for $q$ units, the units of $C''(q)$ are...', choices: ['dollars', 'units per dollar', 'dollars per unit', 'dollars squared'], a: 2, exp: 'Output units per input unit.'}
      - {type: num, d: 2, q: 'Pace model $t(d)=7.5d+0.01d^2$ minutes after $d$ miles. Instantaneous pace (min/mile) at mile 20?', a: '7.9', exp: '$t''(d)=7.5+0.02d=7.9$.'}
    cards:
      - {f: 'Units of a derivative', b: 'Units of output per unit of input.'}
    fun:
      - kind: fact
        title: "Negative splits are a second derivative"
        body: |
          Running a negative split means your pace function $t'(d)$ is *decreasing*, so
          $t''(d)<0$. Most marathon world records are run with near-even or slightly
          negative splits -- a near-zero second derivative is the most efficient race.

  - id: d-trig
    title: "Derivatives of Trig Functions"
    xp: 40
    optional: true
    prereqs: [d-rules, fn-trig-inverse]
    readings:
      - {book: STW, sec: "2.4", title: "Derivatives of Trigonometric Functions"}
      - {book: OS1, sec: "3.5", title: "Derivatives of Trigonometric Functions"}
    summary: |
      $\frac{d}{dx}\sin x=\cos x$, $\frac{d}{dx}\cos x=-\sin x$. Derivatives cycle every 4.
    key_ideas:
      - '$(\sin)''=\cos$, $(\cos)''=-\sin$, $(\tan)''=\sec^2$.'
      - 'Fourth derivative of $\sin$ is $\sin$ again.'
    ds: |
      Seasonal models and Fourier features use sines; their derivatives give rates of
      seasonal change.
    lab: |
      Plot $\sin x$ and its numerical derivative with `np.gradient`; overlay $\cos x$.
    questions:
      - {type: expr, d: 1, var: x, q: 'Differentiate $3\sin x - 2\cos x$.', a: '3cos(x)+2sin(x)', exp: '$3\cos x+2\sin x$.'}
      - {type: expr, d: 2, var: x, q: 'Differentiate $x\sin x$.', a: 'sin(x)+x*cos(x)', exp: 'Product rule.'}
    cards:
      - {f: '$\frac{d}{dx}\cos x$', b: '$-\sin x$'}
    fun:
      - kind: fact
        title: "Springs and sines"
        body: |
          $\sin$ and $\cos$ satisfy $y''=-y$: acceleration opposite to displacement. That's
          Hooke's law, which is why bouncing springs, pendulums and your arm swing all trace
          sine waves.

  - id: d-chain
    title: "The Chain Rule"
    xp: 90
    prereqs: [d-rules, fn-basics]
    readings:
      - {book: STW, sec: "2.5", title: "The Chain Rule"}
      - {book: OS1, sec: "3.6", title: "The Chain Rule"}
      - {book: MML, sec: "5.1.2", title: "Differentiation Rules (chain rule)"}
    videos:
      - {book: 3B1B, n: 4, title: "Visualizing the chain rule and product rule"}
    summary: |
      $\frac{d}{dx}f(g(x))=f'(g(x))\,g'(x)$. Rates multiply through a composition:
      $\frac{dy}{dx}=\frac{dy}{du}\frac{du}{dx}$. THE most important rule for machine learning.
    key_ideas:
      - 'Outside derivative (evaluated at the inside) times inside derivative.'
      - 'Leibniz form: $\frac{dy}{dx}=\frac{dy}{du}\cdot\frac{du}{dx}$ -- sensitivities multiply.'
      - 'Long chains: multiply all the local derivatives along the path.'
    ds: |
      A neural net is $f_L(\dots f_2(f_1(x)))$. Backprop computes $\frac{\partial L}{\partial
      \theta}$ by multiplying local derivatives backward along the chain. Vanishing gradients
      = multiplying many numbers $<1$.
    lab: |
      Compute $\frac{d}{dx}\sigma(\sigma(\sigma(x)))$ at $x=0$ by hand with the chain rule,
      then check with `jax.grad` or `torch.autograd`. Notice each layer shrinks the gradient.
    questions:
      - {type: expr, d: 1, var: x, q: 'Differentiate $(3x^2+1)^5$.', a: '30x(3x^2+1)^4', exp: '$5(3x^2+1)^4\cdot 6x$.'}
      - {type: expr, d: 2, var: x, q: 'Differentiate $\sqrt{1+x^2}$.', a: 'x/sqrt(1+x^2)', exp: '$\frac{1}{2\sqrt{1+x^2}}\cdot 2x$.'}
      - {type: expr, d: 2, var: x, q: 'Differentiate $\sin(x^3)$.', a: '3x^2*cos(x^3)', exp: 'Outer $\cos(\cdot)$ at inner, times $3x^2$.'}
      - {type: num, d: 3, q: 'If $y=u^3$, $u=2x+1$, find $\frac{dy}{dx}$ at $x=1$.', a: '54', exp: '$3u^2\cdot 2$ with $u=3$: $27\cdot 2=54$.'}
    cards:
      - {f: 'Chain rule', b: '$(f\circ g)''(x)=f''(g(x))\,g''(x)$'}
      - {f: 'Why do gradients vanish in deep sigmoid nets?', b: 'Chain rule multiplies many local derivatives; $\sigma''\le 1/4$, so the product shrinks exponentially with depth.'}
    fun:
      - kind: fact
        title: "Backprop is just the chain rule"
        body: |
          The 1986 Rumelhart-Hinton-Williams paper that ignited neural networks is,
          mathematically, the chain rule from this lesson applied in a clever order. Every
          LLM training run performs trillions of chain-rule multiplications.

  - id: d-implicit
    title: "Implicit Differentiation & Inverse Functions"
    xp: 60
    prereqs: [d-chain]
    readings:
      - {book: STW, sec: "2.6", title: "Implicit Differentiation"}
      - {book: STW, sec: "6.1", title: "Inverse Functions (derivative of an inverse)"}
      - {book: STW, sec: "6.6", title: "Inverse Trigonometric Functions"}
      - {book: OS1, sec: "3.7", title: "Derivatives of Inverse Functions"}
      - {book: OS1, sec: "3.8", title: "Implicit Differentiation"}
    videos:
      - {book: 3B1B, n: 6, title: "Implicit differentiation, what's going on here?"}
    summary: |
      Differentiate both sides of an equation like $x^2+y^2=25$, treating $y$ as $y(x)$.
      Inverse functions: $(f^{-1})'(y)=\frac{1}{f'(x)}$.
    key_ideas:
      - 'Every $y$ term picks up a factor $\frac{dy}{dx}$ by the chain rule.'
      - 'Inverse function rule: slopes are reciprocals.'
      - '$\frac{d}{dx}\arctan x=\frac{1}{1+x^2}$.'
    ds: |
      Implicit differentiation powers "implicit layers" and hyperparameter optimization:
      differentiate through the *condition* a solution satisfies, not the algorithm that
      found it.
    lab: |
      Use sympy's `idiff(x**2 + y**2 - 25, y, x)` to check your implicit derivative.
    questions:
      - {type: expr, d: 2, var: 'x,y', q: 'For $x^2+y^2=25$, find $\frac{dy}{dx}$ in terms of $x$ and $y$.', a: '-x/y', exp: '$2x+2y\,y''=0$.'}
      - {type: num, d: 2, q: 'Slope of $x^2+y^2=25$ at $(3,4)$?', a: '-3/4', exp: '$-x/y$.'}
      - {type: num, d: 2, q: 'If $f(2)=5$ and $f''(2)=4$, what is $(f^{-1})''(5)$?', a: '1/4', exp: 'Reciprocal slope at the matching point.'}
    cards:
      - {f: 'Derivative of an inverse: $(f^{-1})''(b)$ where $f(a)=b$', b: '$1/f''(a)$'}
      - {f: '$\frac{d}{dx}\arctan x$', b: '$\frac{1}{1+x^2}$'}
    fun:
      - kind: puzzle
        title: "The ladder problem preview"
        body: |
          A 10 m ladder slides down a wall. Its base moves out at 1 m/s. How fast is the top
          sliding down when the base is 6 m out? (Differentiate $x^2+y^2=100$ with respect to
          time!)
        answer: "$2x\\dot x+2y\\dot y=0$ with $x=6, y=8, \\dot x=1$: $\\dot y=-3/4$ m/s."

  - id: d-explog
    title: "Derivatives of Exponentials & Logs"
    xp: 80
    prereqs: [d-chain, fn-explog]
    readings:
      - {book: STW, sec: "6.2", title: "Exponential Functions and Their Derivatives"}
      - {book: STW, sec: "6.4", title: "Derivatives of Logarithmic Functions"}
      - {book: OS1, sec: "3.9", title: "Derivatives of Exponential and Logarithmic Functions"}
    videos:
      - {book: 3B1B, n: 5, title: "What's so special about Euler's number e?"}
    summary: |
      $(e^x)'=e^x$, $(\ln x)'=\frac1x$, $(a^x)'=a^x\ln a$. Logarithmic differentiation tames
      products and powers.
    key_ideas:
      - '$e^x$ is the unique function (up to scale) equal to its own derivative.'
      - '$\frac{d}{dx}\ln f(x)=\frac{f''(x)}{f(x)}$ (relative rate of change).'
      - 'Sigmoid''s derivative: $\sigma''(x)=\sigma(x)(1-\sigma(x))$.'
    ds: |
      Gradient of log-likelihood: $\frac{d}{d\theta}\ln p=\frac{p'}{p}$. Sigmoid's neat
      derivative is why logistic regression's gradient is simply $(\hat y-y)x$.
    lab: |
      Derive $\sigma'(x)$ by hand, then verify `sig(x)*(1-sig(x))` matches a central
      finite difference on 1000 random points.
    questions:
      - {type: expr, d: 1, var: x, q: 'Differentiate $e^{3x}$.', a: '3e^(3x)', exp: 'Chain rule.'}
      - {type: expr, d: 2, var: x, q: 'Differentiate $\ln(x^2+1)$.', a: '2x/(x^2+1)', exp: '$f''/f$.'}
      - {type: expr, d: 2, var: x, q: 'Differentiate $x e^{-x}$ (type it as x*e^(-x)).', a: 'e^(-x)-x*e^(-x)', exp: 'Product rule: $e^{-x}(1-x)$.'}
      - {type: num, d: 3, q: 'Using $\sigma''=\sigma(1-\sigma)$, what is the maximum value of $\sigma''(x)$?', a: '1/4', exp: 'Maximized at $\sigma=1/2$ (i.e. $x=0$): $\frac12\cdot\frac12$.'}
    cards:
      - {f: '$\frac{d}{dx}\ln f(x)$', b: '$f''(x)/f(x)$'}
      - {f: '$\sigma''(x)$ in terms of $\sigma$', b: '$\sigma(x)(1-\sigma(x))$'}
      - {f: '$\frac{d}{dx}a^x$', b: '$a^x\ln a$'}
    fun:
      - kind: puzzle
        title: "Which is bigger: e^pi or pi^e?"
        body: |
          No calculator! Hint: consider $f(x)=\frac{\ln x}{x}$. Find where it's maximized
          using today's derivatives.
        answer: "$f'(x)=\\frac{1-\\ln x}{x^2}$ is zero at $x=e$, the max. So $\\frac{\\ln\\pi}{\\pi}<\\frac{\\ln e}{e}$, giving $e\\ln\\pi<\\pi$, i.e. $\\pi^e<e^\\pi$."
