[project]
name = "calc-tutor"
version = "0.1.0"
description = "Personal calculus-for-data-science tutor: MCP server + gamified web app"
requires-python = ">=3.11"
dependencies = [
    "fastmcp==3.4.4",
    "sympy>=1.12",
    "fsrs==6.3.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "uvicorn>=0.29",
    "starlette>=0.37",
    "rmscene==0.8.0",
    "pillow>=10.0",
    "pypdf>=5.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calc_tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
# rmscene 0.8.0 pins packaging<24, which conflicts with fastmcp; it works fine with newer packaging.
override-dependencies = ["packaging>=24"]
